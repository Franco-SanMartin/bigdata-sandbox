# Arma la imagen, la PRUEBA de punta a punta (pruebas/probar.sh: el paso a paso
# de TUTORIAL.md con MapReduce, Pig, Hive, Spark y Sqoop) y, si todo da bien, la
# publica en Docker Hub (franki678/bigdata-sandbox) para bajarla con 'docker pull'.
# Necesita en el repo (Settings > Secrets and variables > Actions) la variable
# DOCKERHUB_USERNAME y el secreto DOCKERHUB_TOKEN (token de Docker Hub con
# permiso Read & Write; cuando vence, hay que generar otro y reemplazarlo).
# Corre sola cuando cambia el codigo en main, o a mano desde la pestaña Actions
# ("Run workflow").
name: Imagen

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # para subir el archivo del aula a Releases

env:
  IMAGEN: docker.io/franki678/bigdata-sandbox:latest

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # QEMU: para armar tambien la version ARM64 (Mac M1-M4)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1. Armar la version amd64 y cargarla en el Docker del runner
      - name: Armar (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: franki678/bigdata-sandbox
          # Cache de capas en GitHub: si solo cambian scripts o ejemplos, no
          # vuelve a bajar todo de Apache (lo que mas tarda)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Prenderla como lo haria un alumno y esperar el cartel LISTO
      - name: Prender el cluster
        run: |
          docker run -d --name bigdata \
            -e DATANODES=2 -e REPLICATION=2 -e BLOCK_SIZE=1m \
            -v "$PWD/datos-prueba:/datos" franki678/bigdata-sandbox
          for i in $(seq 1 60); do
            if docker logs bigdata 2>&1 | grep -q 'Cluster LISTO'; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' bigdata)" != true ]; then break; fi
            sleep 5
          done
          docker logs bigdata
          exit 1

      # 3. El paso a paso del tutorial, verificando los resultados
      - name: Probar MapReduce, Pig, Hive, Spark y Sqoop
        run: |
          docker cp pruebas/probar.sh bigdata:/tmp/probar.sh
          docker exec bigdata bash /tmp/probar.sh

      - name: Logs si algo fallo
        if: failure()
        run: |
          docker logs bigdata || true
          docker exec bigdata bash -c 'tail -n 80 /opt/hadoop/logs/*.log /opt/hive/*.log /var/log/mysql/error.log' || true

      # 4. Recien ahora, publicar amd64 + arm64 (reusa lo ya armado)
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          tags: ${{ env.IMAGEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hadoop + Pig + Hive + Spark + Sqoop en un solo contenedor

      # 5. La misma imagen (amd64) en un solo archivo, para bajarla una vez y
      #    repartirla en el aula (README seccion 5B). Queda en el release
      #    'imagen' y se reemplaza en cada publicacion.
      - name: Archivo para el aula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker rm -f bigdata
          docker save franki678/bigdata-sandbox | gzip > bigdata-sandbox.tar.gz
          ls -lh bigdata-sandbox.tar.gz
          # Releases acepta hasta 2 GiB por archivo
          [ "$(stat -c %s bigdata-sandbox.tar.gz)" -lt 2147483648 ]
          # Probar lo que hace el aula: compartirlo como la PC del profesor,
          # bajarlo como un alumno y cargarlo
          docker run -d --rm --name compartir -p 8000:8000 -v "$PWD:/srv:ro" -w /srv \
            --entrypoint python3 franki678/bigdata-sandbox -m http.server 8000
          sleep 3
          curl -sf -o /tmp/bajado.tar.gz http://localhost:8000/bigdata-sandbox.tar.gz
          docker stop compartir
          cmp bigdata-sandbox.tar.gz /tmp/bajado.tar.gz
          docker image rm franki678/bigdata-sandbox
          docker load -i /tmp/bajado.tar.gz
          docker image inspect -f '{{.Architecture}}' franki678/bigdata-sandbox:latest
          # Subirlo
          if ! gh release view imagen > /dev/null 2>&1; then
            gh release create imagen --title "Imagen para el aula" \
              --notes "La imagen en un solo archivo, para bajarla una vez y repartirla (README, seccion 5B). Se actualiza sola en cada publicacion."
          fi
          gh release upload imagen bigdata-sandbox.tar.gz --clobber
