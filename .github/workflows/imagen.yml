# Arma las versiones de la imagen (cada una es un --target del Dockerfile),
# las PRUEBA en todos los escenarios y, solo desde main y si TODO dio bien, las
# publica en Docker Hub:
#
#   franki678/bigdata-sandbox:base      Hadoop + Pig + Hive + Spark + Sqoop/MySQL + MongoDB (Ubuntu 24.04)
#   franki678/bigdata-sandbox:latest    = base (la misma imagen, mismo digest)
#   franki678/bigdata-sandbox:ml        base + pandas, scikit-learn, Spark MLlib y JupyterLab
#
# Como sigue:
#   0. previo     en un push a main: si ESTE MISMO commit ya paso en verde en
#                 otra rama (p.ej. versiones, y main avanzo hasta ahi), no se
#                 vuelve a armar ni a probar: se publica lo que subio ese run.
#   1. armar      una maquina por procesador (Intel/AMD y ARM64, las dos
#                 nativas, sin emular): arma base y ml, mide su tamaño y las
#                 deja como artifact del run. Ademas las sube a Docker Hub
#                 SIN tag (solo por digest: nadie las baja asi), para que
#                 "publicar" (aca o en el run de main) les ponga los tags.
#                 Cache de capas en ghcr.io/franki-678/bigdata-sandbox-cache,
#                 la misma para todas las ramas: si solo cambian scripts o
#                 ejemplos, no vuelve a bajar todo de Apache.
#   2. escenarios cada escenario de pruebas/escenarios.sh en una maquina
#                 aparte, en las dos arquitecturas, con la imagen del paso 1
#                 (la de este commit, no la publicada).
#   3. resumen    tamaños y RAM medidos, en el resumen del run.
#   4. publicar   solo en main y solo si pasaron TODOS los escenarios: pone
#                 los tags base, latest y ml a lo que subio el paso 1.
#
# El archivo del aula (Releases, guias/01-instalacion.md) NO se arma aca: es
# el workflow "Aula", a mano, despues de que este publico.
# Necesita en el repo (Settings > Secrets and variables > Actions) la
# variable DOCKERHUB_USERNAME y el secreto DOCKERHUB_TOKEN (token de Docker
# Hub con permiso Read & Write; cuando vence, hay que generar otro).
name: Imagen

on:
  push:
    branches: [main, versiones]
    # Solo documentacion o workflows que no arman nada: no hace falta rearmar
    # la imagen (las guias se prueban en el workflow "Documentacion")
    paths-ignore:
      - '**.md'
      - 'guias/**'
      - 'docs/**'
      - 'pruebas/tutoriales.py'
      - 'pruebas/enlaces.py'
      - '.github/workflows/docs.yml'
      - '.github/workflows/aula.yml'
      - '.github/workflows/escenarios.yml'
      - '.github/workflows/borrar-tag.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # cache de capas en ghcr.io
  actions: read     # buscar el run verde de este commit y bajar sus digests

# Un solo run por rama; en las demas ramas, uno nuevo cancela el anterior
concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REPO: docker.io/franki678/bigdata-sandbox
  LOCAL: franki678/bigdata-sandbox
  CACHE: ghcr.io/franki-678/bigdata-sandbox-cache

jobs:
  # -------------------------------------------------------------------------
  # 0. Este commit ya paso en verde en otra rama? Entonces no se rearma
  # -------------------------------------------------------------------------
  previo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.buscar.outputs.run }}
    steps:
      - name: Run verde de este mismo commit en otra rama
        id: buscar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/imagen.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=50" \
                 --jq '.workflow_runs[] | select(.head_branch != "main" and .event == "push") | "\(.id) \(.head_branch)"')
          while read -r run rama; do
            [ -n "$run" ] || continue
            # Tiene que tener los digests de las dos arquitecturas (y que no hayan vencido)
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name == "digests-amd64" or .name == "digests-arm64"))] | length')
            if [ "$n" = 2 ]; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "$GITHUB_SHA ya paso en verde en $rama (run $run): se publica eso, sin rearmar" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$runs"
          echo "No hay un run verde de $GITHUB_SHA con digests: se arma y se prueba todo"

  # -------------------------------------------------------------------------
  # 1. Armar base y ml, una maquina por arquitectura
  # -------------------------------------------------------------------------
  armar:
    needs: previo
    if: needs.previo.outputs.run == ''
    runs-on: ${{ matrix.arq == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arq: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Lugar en disco (la imagen descomprimida ocupa varios GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          command -v zstd > /dev/null && command -v pigz > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd pigz; }
          df -h / "$RUNNER_TEMP"

      # Fecha fija (la del commit) en la imagen: si se vuelve a armar con todo
      # del cache sale identica, con el mismo digest. Asi lo que se sube es
      # exactamente lo que se probo (se verifica abajo).
      - name: Fecha del commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Armar base (${{ matrix.arq }})
        id: base
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/${{ matrix.arq }}
          load: true
          provenance: false
          tags: ${{ env.LOCAL }}:base
          # Cache de capas (una por version y arquitectura) en ghcr.io: la ven
          # todas las ramas. La de GitHub (gha) queda solo para leer la vieja.
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }}
            type=gha,scope=base-${{ matrix.arq }}
          cache-to: type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hadoop + Pig + Hive + Spark + Sqoop + MongoDB en un solo contenedor

      - name: Armar ml (${{ matrix.arq }})
        id: ml
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/${{ matrix.arq }}
          load: true
          provenance: false
          tags: ${{ env.LOCAL }}:ml
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }}
            type=registry,ref=${{ env.CACHE }}:ml-${{ matrix.arq }}
            type=gha,scope=ml-${{ matrix.arq }}
          cache-to: type=registry,ref=${{ env.CACHE }}:ml-${{ matrix.arq }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=BigData sandbox + pandas, scikit-learn, Spark MLlib y JupyterLab

      # Subir por digest, sin tag. Sale todo del cache del paso de arriba (no
      # se vuelve a armar nada). Los tags se ponen recien en "publicar", solo
      # en main y si pasaron todos los escenarios (en este run o en el de otra
      # rama con el mismo commit).
      - name: Subir base por digest (sin tag)
        id: base_push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/${{ matrix.arq }}
          provenance: false
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hadoop + Pig + Hive + Spark + Sqoop + MongoDB en un solo contenedor

      - name: Subir ml por digest (sin tag)
        id: ml_push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/${{ matrix.arq }}
          provenance: false
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }}
            type=registry,ref=${{ env.CACHE }}:ml-${{ matrix.arq }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=BigData sandbox + pandas, scikit-learn, Spark MLlib y JupyterLab

      - name: Lo subido es lo mismo que se va a probar
        env:
          BASE_PROBADA: ${{ fromJSON(steps.base.outputs.metadata)['containerimage.config.digest'] }}
          BASE_SUBIDA: ${{ fromJSON(steps.base_push.outputs.metadata)['containerimage.config.digest'] }}
          ML_PROBADA: ${{ fromJSON(steps.ml.outputs.metadata)['containerimage.config.digest'] }}
          ML_SUBIDA: ${{ fromJSON(steps.ml_push.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          echo "base: armada $BASE_PROBADA / subida $BASE_SUBIDA"
          echo "ml:   armada $ML_PROBADA / subida $ML_SUBIDA"
          [ -n "$BASE_PROBADA" ] && [ "$BASE_PROBADA" = "$BASE_SUBIDA" ]
          [ -n "$ML_PROBADA" ] && [ "$ML_PROBADA" = "$ML_SUBIDA" ]
          mkdir -p digests
          echo "${{ steps.base_push.outputs.digest }}" > digests/base-${{ matrix.arq }}
          echo "${{ steps.ml_push.outputs.digest }}" > digests/ml-${{ matrix.arq }}
          cat digests/*

      - name: Cache de capas en ghcr.io
        run: |
          for v in base ml; do
            if docker buildx imagetools inspect "$CACHE:$v-${{ matrix.arq }}" > /dev/null 2>&1; then
              echo "cache $v-${{ matrix.arq }}: ok"
            else
              echo "::warning::no quedo la cache $v-${{ matrix.arq }} en ghcr.io (el proximo run arma de cero)"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arq }}
          path: digests/
          retention-days: 7

      # Descarga: lo que baja 'docker pull' (comprimido; aproximado con gzip
      # de 'docker save', que es tambien el archivo del aula). Descomprimida:
      # lo que ocupa el sistema de archivos de la imagen.
      - name: Tamaños
        run: |
          mkdir -p medidas
          for v in base ml; do
            descarga=$(docker save "$LOCAL:$v" | pigz -c | wc -c)
            disco=$(docker run --rm --entrypoint /usr/bin/du "$LOCAL:$v" -sxb / | cut -f1)
            printf '| %s | %s | %s | %s |\n' "$v" "${{ matrix.arq }}" \
              "$(numfmt --to=si --suffix=B --format=%.2f "$descarga")" \
              "$(numfmt --to=si --suffix=B --format=%.2f "$disco")" | tee -a medidas/tamanos.md
          done
          docker image ls "$LOCAL"

      - uses: actions/upload-artifact@v4
        with:
          name: medidas-tamanos-${{ matrix.arq }}
          path: medidas/tamanos.md
          retention-days: 7

      # base y ml en un solo archivo (comparten casi todas las capas)
      - name: Guardar las imagenes para los escenarios
        run: |
          docker save "$LOCAL:base" "$LOCAL:ml" | zstd -T0 -3 -q -o "$RUNNER_TEMP/imagenes.tar.zst"
          ls -lh "$RUNNER_TEMP/imagenes.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: imagenes-${{ matrix.arq }}
          path: ${{ runner.temp }}/imagenes.tar.zst
          compression-level: 0
          retention-days: 3

  # -------------------------------------------------------------------------
  # 2. Escenarios, cada uno en una maquina aparte, en las dos arquitecturas
  # -------------------------------------------------------------------------
  escenarios:
    needs: armar
    runs-on: ${{ matrix.arq == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arq: [amd64, arm64]
        escenario: [reinicio, ha, servicios, parametros, volumen-viejo, corte, mongodb, imagen-vieja, volumen-cortado, ml, tutoriales]
        # Los comandos de las guias son los mismos en las dos: alcanza con una
        exclude:
          - arq: arm64
            escenario: tutoriales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: imagenes-${{ matrix.arq }}
          path: ${{ runner.temp }}
      - name: Cargar la imagen armada
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          zstd -dc "$RUNNER_TEMP/imagenes.tar.zst" | docker load
          rm "$RUNNER_TEMP/imagenes.tar.zst"
          docker image ls "$LOCAL"
      - name: Escenario ${{ matrix.escenario }} (${{ matrix.arq }})
        env:
          IMAGEN: ${{ env.LOCAL }}:${{ matrix.escenario == 'ml' && 'ml' || 'base' }}
          MEDIDAS: medidas.md
        run: |
          docker image inspect -f '{{.Architecture}}' "$IMAGEN"
          bash pruebas/escenarios.sh ${{ matrix.escenario }}
      - name: Medidas de RAM
        if: always()
        run: |
          mkdir -p medidas
          [ -f medidas.md ] && sed 's/^| /| ${{ matrix.arq }} | /' medidas.md > medidas/ram.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medidas-ram-${{ matrix.arq }}-${{ matrix.escenario }}
          path: medidas/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Tamaños y RAM medidos, en el resumen del run
  # -------------------------------------------------------------------------
  resumen:
    needs: [armar, escenarios]
    if: always() && needs.armar.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: medidas-*
          path: medidas
      - name: Resumen
        run: |
          {
            echo "## Tamaños"
            echo
            echo "| Versión | Arquitectura | Descarga (comprimida) | Descomprimida |"
            echo "|---|---|--:|--:|"
            cat medidas/medidas-tamanos-*/tamanos.md 2> /dev/null | sort || true
            echo
            echo "## RAM (docker stats, 2 DataNodes; reposo = 30 s después de LISTO; pico = mientras corren las pruebas)"
            echo
            echo "| Arquitectura | Versión y servicios | En reposo | Pico con trabajos |"
            echo "|---|---|--:|--:|"
            cat medidas/medidas-ram-*/ram.md 2> /dev/null | sort || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 4. Publicar: SOLO desde main y con TODOS los escenarios en verde
  # -------------------------------------------------------------------------
  publicar:
    needs: [previo, armar, escenarios]
    # Lo armado y probado en este run, o lo de un run verde del mismo commit
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.previo.outputs.run != '' ||
       (needs.armar.result == 'success' && needs.escenarios.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
          run-id: ${{ needs.previo.outputs.run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Tags base, latest (= base) y ml, amd64 + arm64
        run: |
          ls digests
          docker buildx imagetools create -t "$REPO:base" -t "$REPO:latest" \
            "$REPO@$(cat digests/base-amd64)" "$REPO@$(cat digests/base-arm64)"
          docker buildx imagetools create -t "$REPO:ml" \
            "$REPO@$(cat digests/ml-amd64)" "$REPO@$(cat digests/ml-arm64)"

      - name: Verificar lo publicado
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          {
            echo "## Publicado"
            echo
            echo "| Tag | Digest | Arquitecturas |"
            echo "|---|---|---|"
            for t in base latest ml; do
              plataformas=$(docker buildx imagetools inspect "$REPO:$t" --format '{{json .Manifest}}' \
                | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | join(", ")')
              echo "| $t | $(digest "$REPO:$t") | $plataformas |"
              grep -q linux/amd64 <<< "$plataformas"
              grep -q linux/arm64 <<< "$plataformas"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(digest "$REPO:latest")" = "$(digest "$REPO:base")" ]
