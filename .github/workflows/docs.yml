# Documentacion: en cada cambio de README, guias o la pagina de docs/.
#   revisar     links relativos (README, guias y docs/index.html) y que cada
#               bloque de comandos de las guias diga como se prueba. Rapido.
#   demo        que docs/demo/ (la demo de la interfaz en GitHub Pages, bajo
#               /demo/) sea la compilacion de ui/ de este commit: la arma con
#               npm run build:demo y no tiene que cambiar nada.
#   tutoriales  corre los comandos de las guias, en orden, contra la imagen
#               base YA PUBLICADA (escenario 'tutoriales' de
#               pruebas/escenarios.sh). Asi un cambio solo de documentacion
#               no rearma la imagen (el workflow "Imagen" lo ignora) y aun
#               asi se prueba. Cuando cambia la imagen, "Imagen" corre el
#               mismo escenario antes de publicar.
name: Documentacion

on:
  push:
    branches: [main, ui2, 'ui2-*', 'empresa-*']
    paths:
      - '**.md'
      - 'guias/**'
      - 'docs/**'
      - 'ui/**'
      - 'pruebas/tutoriales.py'
      - 'pruebas/enlaces.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Links
        run: python3 -I pruebas/enlaces.py README.md README.en.md CHANGELOG.md datos/README.md guias/*.md docs/index.html
      - name: Marcas de prueba de las guias
        run: python3 -I pruebas/tutoriales.py --revisar guias/[0-9]*.md

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - name: docs/demo al dia con ui/
        run: |
          git status --porcelain -- ../docs/demo
          test -z "$(git status --porcelain -- ../docs/demo)" || {
            echo "::error::docs/demo no es la compilacion de ui/: corre npm run build:demo en ui/ y commitea docs/demo"; exit 1; }

  tutoriales:
    needs: revisar
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IMAGEN: franki678/bigdata-sandbox:base
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la imagen publicada
        run: |
          docker pull -q "$IMAGEN"
          docker image inspect -f '{{.Architecture}} {{.Id}}' "$IMAGEN"
      - name: Comandos de las guias
        run: bash pruebas/escenarios.sh tutoriales
