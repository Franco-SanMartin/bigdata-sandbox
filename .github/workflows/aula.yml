# Archivo para el aula: la imagen base (Intel/AMD) en un solo archivo, para
# bajarla una vez y repartirla en las PCs del aula (guias/01-instalacion.md).
# Lleva UN solo nombre, franki678/bigdata-sandbox:base, el que usan todas las
# guias y el docker-compose.yml: despues de docker load queda una sola fila en
# docker images. Queda en el release 'imagen' como bigdata-sandbox.tar.gz y
# reemplaza al anterior; el texto del release sale de .github/release-imagen.md.
#
# Se corre a mano desde main (pestaña Actions > "Aula" > "Run workflow"),
# despues de que "Imagen" publico una base nueva. Arma el archivo con la
# base PUBLICADA (no vuelve a armar ni a probar nada).
name: Aula

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aula:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # para subir el archivo a Releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGEN: franki678/bigdata-sandbox:base
    steps:
      - uses: actions/checkout@v4

      - name: Armar el archivo con la base publicada (amd64)
        run: |
          docker pull --platform linux/amd64 "$IMAGEN"
          docker image inspect -f '{{.Architecture}} {{.Id}}' "$IMAGEN"
          # Solo esa arquitectura (con el almacen de imagenes de containerd,
          # docker save guardaria todas) y solo el tag :base.
          plataforma=
          docker save --help | grep -q -- --platform && plataforma="--platform linux/amd64"
          echo "docker save $plataforma $IMAGEN"
          docker save $plataforma "$IMAGEN" | gzip > bigdata-sandbox.tar.gz
          ls -lh bigdata-sandbox.tar.gz
          # Releases acepta hasta 2 GiB por archivo
          [ "$(stat -c %s bigdata-sandbox.tar.gz)" -lt 2147483648 ]

      - name: Probar lo que hace el aula
        run: |
          # Compartirlo como la PC del profesor, bajarlo como un alumno y cargarlo
          docker run -d --rm --name compartir -p 8000:8000 -v "$PWD:/srv:ro" -w /srv \
            --entrypoint python3 "$IMAGEN" -m http.server 8000
          sleep 3
          curl -sf -o /tmp/bajado.tar.gz http://localhost:8000/bigdata-sandbox.tar.gz
          docker stop compartir
          cmp bigdata-sandbox.tar.gz /tmp/bajado.tar.gz
          docker image rm "$IMAGEN"
          # Lo que ve el alumno: una sola linea "Loaded image: ...:base" y una
          # sola fila en docker images
          docker load -i /tmp/bajado.tar.gz | tee /tmp/load.txt
          [ "$(cat /tmp/load.txt)" = "Loaded image: $IMAGEN" ]
          docker image ls franki678/bigdata-sandbox | tee /tmp/imagenes.txt
          [ "$(docker image ls -q franki678/bigdata-sandbox | wc -l)" = 1 ]
          [ "$(docker image ls --format '{{.Repository}}:{{.Tag}}' franki678/bigdata-sandbox)" = "$IMAGEN" ]
          docker image inspect -f '{{.Architecture}}' "$IMAGEN" | grep -qx amd64
          docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGEN" | grep -x 'SANDBOX_VERSION=base'

      - name: Subirlo
        run: |
          gh release upload imagen bigdata-sandbox.tar.gz --clobber
          gh release edit imagen --notes-file .github/release-imagen.md
          {
            echo "## Release imagen"
            echo
            echo "| Archivo | Tamaño | Actualizado |"
            echo "|---|--:|---|"
            gh release view imagen --json assets --jq '.assets[] | "| \(.name) | \(.size) | \(.updatedAt) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          subido=$(gh release view imagen --json assets --jq '.assets[] | select(.name == "bigdata-sandbox.tar.gz") | .size')
          [ "$subido" = "$(stat -c %s bigdata-sandbox.tar.gz)" ]
