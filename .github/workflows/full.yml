# Versión full: arma la imagen (target full del Dockerfile: ml + el servidor de
# server/ + la interfaz de ui/ en :8080) y le corre el humo de verdad contra
# Hadoop, YARN, Hive, MySQL y MongoDB reales:
#
#   server/tests/humo/humo_full.py   la API, chequeo por chequeo
#   server/tests/humo/humo_ui.py     la interfaz en un Chromium (Playwright):
#                                    cada pantalla sin errores de consola, y
#                                    pipeline, consulta y entrenamiento desde ahí
#
# NO publica nada en Docker Hub: la imagen queda solo en la máquina del run.
# Lo que sale es un artifact por arquitectura (humo-full-<arq>) con los
# resúmenes, las respuestas del servidor, las salidas crudas de cada servicio
# (sirven de fixtures para los tests de server/) y las capturas de la interfaz.
name: Full

on:
  push:
    branches: [full]
    paths-ignore: ['**.md', 'docs/**', 'guias/**', 'capturas/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # el cache de capas en ghcr.io

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: bigdata-sandbox-ci:full
  CACHE: ghcr.io/franki-678/bigdata-sandbox-cache

jobs:
  humo:
    runs-on: ${{ matrix.arq == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arq: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Lugar en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Cache de capas en ghcr.io, uno por versión y arquitectura: usa el de
      # base y ml que deja el workflow Imagen y guarda el suyo (la interfaz
      # compilada y el servidor). Si el cache no se puede escribir, sigue igual.
      - name: Armar full (${{ matrix.arq }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/${{ matrix.arq }}
          load: true
          provenance: false
          tags: ${{ env.IMAGEN }}
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:base-${{ matrix.arq }}
            type=registry,ref=${{ env.CACHE }}:ml-${{ matrix.arq }}
            type=registry,ref=${{ env.CACHE }}:full-${{ matrix.arq }}
            type=gha,scope=base-${{ matrix.arq }}
            type=gha,scope=ml-${{ matrix.arq }}
          cache-to: type=registry,ref=${{ env.CACHE }}:full-${{ matrix.arq }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Tamaño
        run: docker image ls "$IMAGEN"

      - name: Levantar el contenedor (espera «Iniciar»)
        run: |
          docker run -d --name humo -p 127.0.0.1:8080:8080 -v humo_hadoop:/hadoop "$IMAGEN"
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/status > /dev/null && break
            sleep 1
          done
          echo "el servidor contestó a los ${i} s"
          curl -sf http://localhost:8080/api/status | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s["phase"]); assert s["phase"] == "stopped"'

      # Mientras arma y corre el humo de la API, se instala el navegador
      - name: Playwright (en segundo plano)
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          ( "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.55.0 \
            && "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium \
            && touch "$RUNNER_TEMP/pw-listo" ) > "$RUNNER_TEMP/pw.log" 2>&1 &

      - name: Humo de la API
        id: humo
        env:
          HUMO_CONTENEDOR: humo
          HUMO_SALIDAS: ${{ runner.temp }}/humo-salidas
          HUMO_DEJAR_PRENDIDO: "1"
        run: python3 server/tests/humo/humo_full.py

      - name: Humo de la interfaz (Playwright)
        id: ui
        if: always()
        env:
          HUMO_CONTENEDOR: humo
          HUMO_SALIDAS: ${{ runner.temp }}/humo-salidas
        run: |
          for i in $(seq 1 300); do [ -f "$RUNNER_TEMP/pw-listo" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/pw-listo" ] || { cat "$RUNNER_TEMP/pw.log"; exit 1; }
          "$RUNNER_TEMP/pw/bin/python" server/tests/humo/humo_ui.py

      - name: AUTOSTART=1 arranca solo y docker stop apaga en orden
        if: always()
        run: |
          set -u
          S="$RUNNER_TEMP/humo-salidas"; mkdir -p "$S"
          docker logs humo > "$S/docker_logs_humo.txt" 2>&1 || true
          docker rm -f humo > /dev/null 2>&1 || true
          docker volume rm humo_hadoop > /dev/null 2>&1 || true
          t0=$(date +%s)
          docker run -d --name auto -p 127.0.0.1:8081:8080 -e AUTOSTART=1 -e SERVICIOS=hdfs -e DATANODES=1 "$IMAGEN"
          fase=""
          for i in $(seq 1 150); do
            fase=$(curl -s http://localhost:8081/api/status | python3 -c 'import json,sys; print(json.load(sys.stdin)["phase"])' 2>/dev/null || true)
            [ "$fase" = running ] && break
            sleep 2
          done
          arranque=$(( $(date +%s) - t0 ))
          t1=$(date +%s)
          docker stop -t 20 auto > /dev/null
          apagado=$(( $(date +%s) - t1 ))
          codigo=$(docker inspect -f '{{.State.ExitCode}}' auto)
          docker logs auto > "$S/docker_logs_auto.txt" 2>&1 || true
          {
            echo "### AUTOSTART=1 (${{ matrix.arq }})"
            echo "fase: $fase, arrancó en ${arranque} s; docker stop tardó ${apagado} s, código de salida ${codigo}"
          } | tee -a "$S/autostart.md"
          en_orden=no
          grep -q "Apagando el cluster en orden" "$S/docker_logs_auto.txt" && grep -q "Cluster apagado" "$S/docker_logs_auto.txt" && en_orden=si
          echo "apagó en orden (Apagando... y Cluster apagado en docker logs): $en_orden" | tee -a "$S/autostart.md"
          [ "$fase" = running ] && [ "$apagado" -lt 20 ] && [ "$codigo" = 143 -o "$codigo" = 0 ] && [ "$en_orden" = si ]

      - name: Resumen
        if: always()
        run: |
          S="$RUNNER_TEMP/humo-salidas"
          { echo "# ${{ matrix.arq }}"; cat "$S/resumen.md" "$S/resumen-ui.md" "$S/autostart.md" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humo-full-${{ matrix.arq }}
          path: ${{ runner.temp }}/humo-salidas
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-full-${{ matrix.arq }}
          path: ${{ runner.temp }}/humo-salidas/capturas
          retention-days: 30
