# Prueba una version YA PUBLICADA en Docker Hub (la misma que baja cualquiera
# con 'docker pull') en los escenarios de pruebas/escenarios.sh: reinicios,
# alta disponibilidad, cada SERVICIOS, cambios de parametros, volumenes de
# versiones anteriores, primeros arranques cortados, MongoDB y la version ml.
# Cada escenario corre en una maquina aparte, en paralelo.
# La imagen de cada commit ya se prueba entera antes de publicarse (workflow
# "Imagen"); este es para volver a probar lo publicado, a mano desde la
# pestaña Actions ("Escenarios" > "Run workflow").
name: Escenarios

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version a probar (latest es la base)
        type: choice
        options: [latest, base, ml, ubuntu20]
        default: latest
      arm64:
        description: Probar tambien en ARM64 (Mac M1-M4)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGEN: franki678/bigdata-sandbox:${{ inputs.version }}

jobs:
  escenario:
    runs-on: ${{ matrix.arq == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arq: ${{ fromJSON(inputs.arm64 && '["amd64","arm64"]' || '["amd64"]') }}
        escenario: [reinicio, ha, servicios, parametros, volumen-viejo, corte, mongodb, desde-latest, volumen-cortado, ml]
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la imagen
        run: |
          docker pull "$IMAGEN"
          docker image inspect -f '{{.Architecture}}' "$IMAGEN"
      - name: Escenario ${{ matrix.escenario }} (${{ matrix.arq }})
        run: |
          # ubuntu20 es la de antes de las versiones: no tiene MongoDB y no
          # tiene sentido pasar su volumen a ella misma. El escenario ml es
          # solo para la version ml.
          case "${{ matrix.escenario }}-${{ inputs.version }}" in
            mongodb-ubuntu20|desde-latest-ubuntu20|volumen-cortado-ubuntu20|ml-ubuntu20|ml-latest|ml-base)
              echo "No aplica a la version ${{ inputs.version }}"; exit 0 ;;
          esac
          bash pruebas/escenarios.sh ${{ matrix.escenario }}
