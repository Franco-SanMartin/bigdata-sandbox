# Spark corre sobre el YARN del contenedor (spark-shell, pyspark, spark-submit)
spark.master                       yarn
spark.submit.deployMode            client

# Jars de Spark subidos a HDFS en el primer arranque: evita re-subir ~250 MB
# en cada spark-submit
spark.yarn.archive                 @FS@/apps/spark/spark-libs.jar

# Tamanos chicos: entran varios jobs a la vez en los 4 GB de YARN
spark.driver.memory                512m
spark.yarn.am.memory               512m
spark.executor.memory              512m
spark.executor.instances           2
spark.executor.cores               1
spark.sql.shuffle.partitions       4

# Historial de jobs terminados -> Spark History Server (:18080)
spark.eventLog.enabled             true
spark.eventLog.dir                 @FS@/spark-logs
spark.history.fs.logDirectory      @FS@/spark-logs
spark.yarn.historyServer.address   localhost:18080

# Tablas de Spark en el mismo warehouse/metastore que Hive
spark.sql.catalogImplementation    hive
spark.sql.warehouse.dir            @FS@/user/hive/warehouse
