# MongoDB de ejemplo (MONGODB=si). Los datos viven en el volumen
# (/hadoop/mongodb), asi sobreviven a recrear el contenedor. Configurado chico
# para que entre en una notebook junto con Hadoop: ~150-250 MB de memoria.
storage:
  dbPath: /hadoop/mongodb
  wiredTiger:
    engineConfig:
      # Cache de datos en memoria. De fabrica usa la mitad de la RAM menos
      # 1 GB (en una notebook de 8 GB, 3 GB solo para MongoDB). 0.25 es el
      # minimo y para practicar alcanza de sobra.
      cacheSizeGB: 0.25

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  # Para entrar tambien desde la compu (MongoDB Compass), con -p 27017:27017
  bindIp: 0.0.0.0

setParameter:
  # Sin las estadisticas internas que MongoDB guarda cada segundo para
  # diagnosticar problemas (hasta 200 MB de disco en el volumen)
  diagnosticDataCollectionEnabled: false
