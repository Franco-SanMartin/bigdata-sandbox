<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Arquitectura de la versión base: un contenedor con cada servicio como proceso</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <style>
      .caja { stroke-width: 1.5; rx: 6; }
      .t { font-weight: 600; fill: #111827; }
      .s { fill: #374151; font-size: 11.5px; }
      .capa { font-size: 11px; font-weight: 600; letter-spacing: .06em; }
      .l { stroke: #4B5563; stroke-width: 1.3; fill: none; marker-end: url(#f); }
      .p { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- tu compu -->
  <rect x="20" y="12" width="920" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="34" y="30" class="capa" fill="#6B7280">TU COMPU</text>
  <rect x="34" y="40" width="200" height="48" class="caja" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="46" y="58" class="t">Terminal</text><text x="46" y="76" class="s">docker exec -it bigdata bash</text>
  <rect x="250" y="40" width="250" height="48" class="caja" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="262" y="58" class="t">Navegador</text><text x="262" y="76" class="s">localhost:9870, 8088, 10002…</text>
  <rect x="516" y="40" width="200" height="48" class="caja" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="528" y="58" class="t">Carpeta datos/</text><text x="528" y="76" class="s">= /datos adentro</text>
  <rect x="732" y="40" width="196" height="48" class="caja" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="744" y="58" class="t">DBeaver / Compass</text><text x="744" y="76" class="s">localhost:3306 y :27017</text>

  <!-- contenedor -->
  <rect x="20" y="104" width="920" height="476" rx="10" fill="#FBFBFD" stroke="#374151" stroke-width="1.5"/>
  <text x="34" y="124" class="capa" fill="#374151">CONTENEDOR bigdata · franki678/bigdata-sandbox:base · cada servicio es un proceso aparte</text>

  <!-- lenguajes -->
  <text x="34" y="150" class="capa" fill="#7A5AB8">LENGUAJES Y CLIENTES</text>
  <rect x="34" y="158" width="160" height="46" class="caja" fill="#F3EEFA" stroke="#7A5AB8"/>
  <text x="46" y="178" class="t">Pig 0.18</text><text x="46" y="194" class="s">Pig Latin → MapReduce</text>
  <rect x="210" y="158" width="160" height="46" class="caja" fill="#F3EEFA" stroke="#7A5AB8"/>
  <text x="222" y="178" class="t">beeline</text><text x="222" y="194" class="s">cliente SQL de Hive</text>
  <rect x="386" y="158" width="170" height="46" class="caja" fill="#F3EEFA" stroke="#7A5AB8"/>
  <text x="398" y="178" class="t">spark-submit</text><text x="398" y="194" class="s">pyspark · Python</text>
  <rect x="572" y="158" width="160" height="46" class="caja" fill="#F3EEFA" stroke="#7A5AB8"/>
  <text x="584" y="178" class="t">Sqoop 1.4.7</text><text x="584" y="194" class="s">MySQL ⇄ HDFS</text>
  <rect x="748" y="158" width="180" height="46" class="caja" fill="#F3EEFA" stroke="#7A5AB8"/>
  <text x="760" y="178" class="t">hadoop jar</text><text x="760" y="194" class="s">MapReduce y Streaming</text>

  <!-- motores -->
  <text x="34" y="238" class="capa" fill="#3D6FB6">MOTORES</text>
  <rect x="210" y="246" width="200" height="50" class="caja" fill="#EAF1FA" stroke="#3D6FB6"/>
  <text x="222" y="266" class="t">Hive 4.0 · Tez 0.10</text><text x="222" y="284" class="s">JDBC :10000 · Metastore</text>
  <rect x="426" y="246" width="190" height="50" class="caja" fill="#EAF1FA" stroke="#3D6FB6"/>
  <text x="438" y="266" class="t">Spark 3.5</text><text x="438" y="284" class="s">en YARN · History :18080</text>
  <rect x="632" y="246" width="200" height="50" class="caja" fill="#EAF1FA" stroke="#3D6FB6"/>
  <text x="644" y="266" class="t">MapReduce</text><text x="644" y="284" class="s">JobHistory :19888</text>

  <!-- recursos -->
  <text x="34" y="330" class="capa" fill="#A67C1E">RECURSOS</text>
  <rect x="210" y="338" width="622" height="46" class="caja" fill="#FBF4E4" stroke="#A67C1E"/>
  <text x="222" y="358" class="t">YARN (Hadoop 3.3.6)</text><text x="222" y="374" class="s">ResourceManager :8088 · NodeManager :8042 · reparte memoria y CPU entre los trabajos</text>

  <!-- datos -->
  <text x="34" y="418" class="capa" fill="#2F8A78">DATOS</text>
  <rect x="34" y="426" width="440" height="64" class="caja" fill="#E8F4F1" stroke="#2F8A78"/>
  <text x="46" y="446" class="t">HDFS (Hadoop 3.3.6)</text>
  <text x="46" y="463" class="s">NameNode :9870 · DataNodes :9901-9909</text>
  <text x="46" y="479" class="s">HA (2-3 NameNodes): ZooKeeper :2181</text>
  <rect x="490" y="426" width="210" height="64" class="caja" fill="#E8F4F1" stroke="#2F8A78"/>
  <text x="502" y="446" class="t">MySQL (MariaDB 10.11)</text><text x="502" y="463" class="s">:3306 · base tienda</text><text x="502" y="479" class="s">200.000 ventas</text>
  <rect x="716" y="426" width="212" height="64" class="caja" fill="#E8F4F1" stroke="#2F8A78"/>
  <text x="728" y="446" class="t">MongoDB 8.0</text><text x="728" y="463" class="s">:27017 · con MONGODB=si</text><text x="728" y="479" class="s">20.000 pedidos</text>

  <!-- volumen -->
  <rect x="34" y="510" width="894" height="54" rx="8" fill="#F8EEE8" stroke="#B8613F"/>
  <text x="46" y="531" class="t">Volumen bigdata_hadoop → /hadoop</text>
  <text x="46" y="550" class="s">bloques y metadatos de HDFS, metastore de Hive (Derby), bases de MySQL y MongoDB: sobreviven a docker stop y a docker rm</text>

  <!-- flechas -->
  <path class="l" d="M114,204 L114,226 L700,226 L700,244"/>
  <path class="l" d="M290,204 L290,244"/>
  <path class="l" d="M470,204 L500,244"/>
  <path class="l" d="M652,204 L652,226 L720,226 L720,244"/>
  <path class="l" d="M838,204 L838,226 L760,226 L760,244"/>
  <path class="l" d="M310,296 L310,336"/>
  <path class="l" d="M520,296 L520,336"/>
  <path class="l" d="M730,296 L730,336"/>
  <path class="l" d="M400,384 L330,424"/>
  <path class="l p" d="M600,204 L600,214 L884,214 L884,410 L640,410 L640,424"/>
  <text x="890" y="320" class="s">JDBC</text>
</svg>
