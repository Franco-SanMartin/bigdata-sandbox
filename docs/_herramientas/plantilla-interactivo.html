<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('datos').textContent);
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...hijos) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const h of hijos.flat(Infinity)) if (h != null && h !== false) e.append(h.nodeType ? h : document.createTextNode(String(h)));
    return e;
  };
  // replaceChildren con la misma limpieza que el(): aplana listas y saltea null/undefined/false
  const poner = (dest, ...hijos) => dest.replaceChildren(...hijos.flat(Infinity).filter((h) => h != null && h !== false));
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
    return e;
  };
  // Texto con `codigo` y **negrita** (lo unico de Markdown que entienden los textos del .json)
  const rico = (t) => {
    const f = document.createDocumentFragment();
    String(t ?? '').split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((p) => {
      if (/^`.*`$/.test(p)) f.append(el('code', {}, p.slice(1, -1)));
      else if (/^\*\*.*\*\*$/.test(p)) f.append(el('strong', {}, p.slice(2, -2)));
      else if (p) f.append(p);
    });
    return f;
  };
  const porId = new Map(D.componentes.map((c) => [c.id, c]));
  const capas = D.capas.filter((k) => D.componentes.some((c) => c.capa === k.id));
  const colorCapa = (id) => (D.capas.find((k) => k.id === id) || {}).color || '#6B7280';
  const nombreCapa = (id) => (D.capas.find((k) => k.id === id) || {}).nombre || id;

  const copiar = async (texto, boton) => {
    let ok = false;
    try { await navigator.clipboard.writeText(texto); ok = true; } catch {
      const t = el('textarea', { style: 'position:fixed;opacity:0' }); t.value = texto; document.body.append(t); t.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      t.remove();
    }
    const antes = boton.textContent;
    boton.textContent = ok ? 'Copiado' : 'Seleccioná y copiá';
    boton.classList.toggle('copiado', ok);
    setTimeout(() => { boton.textContent = antes; boton.classList.remove('copiado'); }, 1600);
  };
  const bloqueCmd = (c) => {
    const cmd = typeof c === 'string' ? { cmd: c } : c;
    const boton = el('button', { class: 'btn btn-sm', type: 'button', onclick: (e) => copiar(cmd.cmd, e.currentTarget) }, 'Copiar');
    const donde = cmd.donde ? ({ compu: 'En tu compu (terminal)', adentro: 'Adentro del contenedor (docker exec -it bigdata bash)' }[cmd.donde] || cmd.donde) : null;
    return el('div', { class: 'cmd' }, donde && el('span', { class: 'donde' }, donde), el('pre', {}, cmd.cmd), boton);
  };
  const enlaceGuia = (g) => {
    if (!g) return null;
    const [archivo, seccion] = typeof g === 'string' ? [g, null] : [g.archivo, g.seccion];
    return el('p', {}, 'En la guía: ', el('a', { href: archivo }, seccion || archivo), ' ', el('span', { class: 'version' }, `(${archivo.replace(/#.*/, '')})`));
  };

  // ---- Encabezado
  document.title = D.titulo;
  $('#titulo').append((D.nombre || 'Versión') + ' ', el('span', { class: 'tag' }, D.tag));
  $('#subtitulo').append(rico(D.subtitulo));
  if (D.arranque) {
    const b = el('button', { class: 'btn btn-pri', type: 'button', onclick: (e) => copiar(D.arranque.cmd, e.currentTarget) }, 'Copiar');
    $('#arranque').append(el('code', { title: D.arranque.cmd }, D.arranque.cmd), b);
    $('#arranque').prepend(el('span', { class: 'sr' }, D.arranque.texto || 'Comando para arrancar'));
  }
  $('#pie').append(rico(D.pie || ''));

  // ---- Pestañas
  const tabs = ['mapa', 'uso', 'puertos'];
  const irA = (id, foco = false) => {
    for (const t of tabs) {
      const b = $('#tab-' + t), v = $('#v-' + t), on = t === id;
      b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; v.hidden = !on;
      if (on && foco) b.focus();
    }
    history.replaceState(null, '', '#' + id);
  };
  tabs.forEach((t, i) => {
    const b = $('#tab-' + t);
    b.addEventListener('click', () => irA(t));
    b.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        irA(tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length], true);
      }
    });
  });

  // ---- Dibujo del mapa (filas = capas, cajas repartidas en la fila)
  const W = 1000, ROT = 150, FILA = 104, CAJA_H = 50, MARGEN = 16;
  const pos = new Map();
  capas.forEach((k, fi) => {
    const nodos = D.componentes.filter((c) => c.capa === k.id);
    const util = W - ROT - MARGEN * 2;
    const n = nodos.length;
    const ancho = Math.min(168, (util - (n - 1) * 14) / n);
    const total = n * ancho + (n - 1) * 14;
    nodos.forEach((c, i) => {
      const x = c.x != null ? ROT + MARGEN + c.x * (util - ancho) : ROT + MARGEN + (util - total) / 2 + i * (ancho + 14);
      pos.set(c.id, { x, y: fi * FILA + (FILA - CAJA_H) / 2, w: ancho, h: CAJA_H, fila: fi });
    });
  });
  const H = capas.length * FILA;
  const svg = $('#mapa');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const defs = sv('defs');
  const flecha = (id, color) => {
    const m = sv('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    m.append(sv('path', { d: 'M0 0L10 5L0 10z', fill: color }));
    defs.append(m);
  };
  flecha('fl', '#B0B0AF'); flecha('fl-act', '#141414');
  svg.append(defs);
  capas.forEach((k, fi) => {
    svg.append(sv('rect', { class: 'fila-fondo' + (fi % 2 ? ' par' : ''), x: 0, y: fi * FILA, width: W, height: FILA }));
    svg.append(sv('rect', { x: 0, y: fi * FILA + 12, width: 3, height: FILA - 24, fill: k.color, rx: 1.5 }));
    const t = sv('text', { class: 'capa-rot', x: 14, y: fi * FILA + FILA / 2 - 3, fill: k.color });
    t.textContent = k.nombre;
    svg.append(t);
    if (k.desc) {
      const d = sv('text', { class: 'capa-desc', x: 14, y: fi * FILA + FILA / 2 + 12 });
      d.textContent = k.desc;
      svg.append(d);
    }
  });
  const capaAristas = sv('g'), capaNodos = sv('g');
  svg.append(capaAristas, capaNodos);
  const aristas = D.conexiones.map((cx, i) => {
    const a = pos.get(cx.de), b = pos.get(cx.a);
    let d, lx, ly;
    if (a.fila === b.fila) {
      const [p, q] = a.x < b.x ? [a, b] : [b, a];
      const x1 = p.x + p.w, x2 = q.x, y = p.y + p.h / 2;
      if (q.x - (p.x + p.w) < 40) {
        const arriba = p.y - 18;
        d = `M${a.x + a.w / 2} ${a.y} C${a.x + a.w / 2} ${arriba} ${b.x + b.w / 2} ${arriba} ${b.x + b.w / 2} ${b.y}`;
        lx = (a.x + b.x + a.w) / 2; ly = arriba + 4;
      } else {
        d = a.x < b.x ? `M${x1} ${y} L${x2} ${y}` : `M${x2} ${y} L${x1} ${y}`;
        lx = (x1 + x2) / 2; ly = y - 6;
      }
    } else {
      const baja = a.fila < b.fila;
      const x1 = a.x + a.w / 2, y1 = baja ? a.y + a.h : a.y;
      const x2 = b.x + b.w / 2, y2 = baja ? b.y : b.y + b.h;
      const my = (y1 + y2) / 2;
      d = `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`;
      lx = (x1 + x2) / 2; ly = my;
    }
    const g = sv('g', { class: 'arista' + (cx.tipo === 'control' ? ' control' : '') });
    const p = sv('path', { d, 'marker-end': 'url(#fl)' });
    if (cx.doble) p.setAttribute('marker-start', 'url(#fl)');
    const t = sv('text', { x: lx, y: ly, 'text-anchor': 'middle' });
    t.textContent = cx.que || '';
    g.append(p, t);
    capaAristas.append(g);
    return { cx, g, p, i };
  });
  const nodosSvg = new Map();
  for (const c of D.componentes) {
    const p = pos.get(c.id);
    const g = sv('g', { class: 'nodo', tabindex: 0, role: 'button', 'aria-label': `${c.nombre}: ${nombreCapa(c.capa)}`, 'data-id': c.id });
    g.append(sv('rect', { class: 'caja', x: p.x, y: p.y, width: p.w, height: p.h, rx: 7 }));
    g.append(sv('rect', { x: p.x, y: p.y + 8, width: 3, height: p.h - 16, rx: 1.5, fill: colorCapa(c.capa) }));
    const t1 = sv('text', { class: 'n1', x: p.x + 12, y: p.y + (c.corto ? 21 : 30) });
    t1.textContent = c.nombre;
    g.append(t1);
    if (c.corto) {
      const t2 = sv('text', { class: 'n2', x: p.x + 12, y: p.y + 37 });
      t2.textContent = c.corto;
      g.append(t2);
    }
    g.addEventListener('click', () => elegir(c.id));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); elegir(c.id); } });
    capaNodos.append(g);
    nodosSvg.set(c.id, g);
    // Si el nombre no entra en la caja, se achica la letra
    requestAnimationFrame(() => {
      const largo = t1.getComputedTextLength();
      if (largo > p.w - 18) t1.setAttribute('textLength', p.w - 18), t1.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    });
  }

  // ---- Lista por capas (angosto)
  const chips = new Map();
  for (const k of capas) {
    $('#lista').append(el('h3', { style: `color:${k.color}` }, k.nombre));
    const fila = el('div', { class: 'chips' });
    for (const c of D.componentes.filter((x) => x.capa === k.id)) {
      const b = el('button', { class: 'chip', type: 'button', onclick: () => { elegir(c.id); $('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, c.nombre, c.corto && el('small', {}, c.corto));
      chips.set(c.id, b);
      fila.append(b);
    }
    $('#lista').append(fila);
  }

  // ---- Resaltar
  let seleccion = null;
  const resaltar = (ids, aristasActivas) => {
    const hay = ids && ids.size;
    for (const [id, g] of nodosSvg) {
      g.classList.toggle('atenuado', !!hay && !ids.has(id));
      g.classList.toggle('sel', !!hay && ids.has(id));
    }
    for (const [id, b] of chips) b.classList.toggle('sel', !!hay && ids.has(id));
    for (const a of aristas) {
      const on = aristasActivas ? aristasActivas.has(a.i) : false;
      a.g.classList.toggle('activa', on);
      a.g.classList.toggle('atenuado', !!hay && !on);
      a.p.setAttribute('marker-end', on ? 'url(#fl-act)' : 'url(#fl)');
      if (a.cx.doble) a.p.setAttribute('marker-start', on ? 'url(#fl-act)' : 'url(#fl)');
    }
  };

  // ---- Panel
  const panel = $('#panel');
  const panelInicio = () => {
    poner(panel, 
      el('div', { class: 'inicio-panel' },
        el('h2', {}, 'Cómo leer este mapa'),
        el('ol', {},
          el('li', {}, 'Cada fila es una ', el('strong', {}, 'capa'), ': de dónde entra el usuario (arriba) a dónde quedan los datos (abajo).'),
          el('li', {}, 'Tocá una caja: acá ves qué es, su versión, sus puertos, con qué se conecta y el comando para usarla.'),
          el('li', {}, 'Abajo del mapa, los ', el('strong', {}, 'recorridos'), ' muestran paso a paso qué piezas toca una tarea de punta a punta.'),
          el('li', {}, 'La pestaña ', el('strong', {}, 'Cómo se usa'), ' tiene los pasos para arrancarla y probar cada cosa.')),
        D.intro ? el('p', { style: 'margin-top:12px' }, rico(D.intro)) : null,
        D.guia ? el('p', {}, 'Todo el detalle: ', el('a', { href: D.guia.pdf }, 'guía en PDF'), ' · ', el('a', { href: D.guia.md }, 'guía en Markdown'), ' · ', el('a', { href: D.readme?.pdf || 'README.pdf' }, 'qué es (PDF)')) : null));
  };
  const elegir = (id) => {
    if (seleccion === id) return limpiar();
    seleccion = id;
    recorridoActual = null;
    actualizarBotonesRecorrido();
    const c = porId.get(id);
    const vecinos = new Set([id]);
    const act = new Set();
    for (const a of aristas) if (a.cx.de === id || a.cx.a === id) { act.add(a.i); vecinos.add(a.cx.de); vecinos.add(a.cx.a); }
    resaltar(vecinos, act);
    const sal = aristas.filter((a) => a.cx.de === id), ent = aristas.filter((a) => a.cx.a === id);
    const fila = (a, sale) => {
      const otro = porId.get(sale ? a.cx.a : a.cx.de);
      return el('li', {}, el('span', { class: 'dir', 'aria-label': sale ? 'hacia' : 'desde' }, a.cx.doble ? '⇄' : sale ? '→' : '←'),
        el('div', {}, el('button', { type: 'button', onclick: () => elegir(otro.id) }, otro.nombre), a.cx.que && el('span', { class: 'que' }, rico(a.cx.que))));
    };
    poner(panel, 
      el('span', { class: 'capa-tag' }, el('i', { style: `background:${colorCapa(c.capa)}` }), nombreCapa(c.capa)),
      el('h2', {}, c.nombre),
      c.version && el('div', { class: 'version' }, c.version),
      el('p', { style: 'margin-top:10px' }, rico(c.que)),
      c.puertos?.length ? [el('h3', {}, 'Puertos'), el('ul', { class: 'puertos' }, c.puertos.map((p) => el('li', {}, el('b', {}, p.n), el('span', {}, rico(p.que), p.url ? [' · ', el('a', { href: p.url, target: '_blank', rel: 'noreferrer' }, p.url)] : null))))] : null,
      (sal.length || ent.length) ? [el('h3', {}, 'Se conecta con'), el('ul', { class: 'con' }, sal.map((a) => fila(a, true)), ent.map((a) => fila(a, false)))] : null,
      c.comandos?.length ? [el('h3', {}, 'Cómo se usa'), c.comandos.map(bloqueCmd)] : null,
      c.no ? [el('h3', {}, 'Qué no hace'), el('p', { class: 'nota-no' }, rico(c.no))] : null,
      c.guia ? [el('h3', {}, 'Más'), enlaceGuia(c.guia)] : null,
      el('div', { class: 'paso-nav' }, el('button', { class: 'btn btn-sm', type: 'button', onclick: limpiar }, 'Ver todo el mapa')));
  };
  const limpiar = () => {
    seleccion = null; recorridoActual = null;
    actualizarBotonesRecorrido();
    resaltar(null, null);
    panelInicio();
  };

  // ---- Recorridos
  let recorridoActual = null, pasoActual = 0;
  const botonesRec = new Map();
  const actualizarBotonesRecorrido = () => { for (const [id, b] of botonesRec) b.setAttribute('aria-pressed', recorridoActual?.id === id); };
  const mostrarPaso = () => {
    const r = recorridoActual, p = r.pasos[pasoActual];
    const ids = new Set(p.nodos);
    const act = new Set(aristas.filter((a) => (p.aristas ? p.aristas.some(([x, y]) => (a.cx.de === x && a.cx.a === y) || (a.cx.de === y && a.cx.a === x)) : ids.has(a.cx.de) && ids.has(a.cx.a))).map((a) => a.i));
    resaltar(ids, act);
    poner(panel, 
      el('span', { class: 'capa-tag' }, 'Recorrido'),
      el('h2', {}, r.nombre),
      r.desc && el('p', { style: 'color:var(--text-3)' }, rico(r.desc)),
      el('h3', {}, `Paso ${pasoActual + 1}: ${p.titulo || ''}`),
      el('p', {}, rico(p.texto)),
      p.cmd ? bloqueCmd(p.cmd) : null,
      el('div', { class: 'paso-nav' },
        el('button', { class: 'btn btn-sm', type: 'button', disabled: pasoActual === 0, onclick: () => { pasoActual--; mostrarPaso(); } }, '← Anterior'),
        el('span', { class: 'paso-n' }, `${pasoActual + 1} de ${r.pasos.length}`),
        pasoActual < r.pasos.length - 1
          ? el('button', { class: 'btn btn-sm btn-pri', type: 'button', onclick: () => { pasoActual++; mostrarPaso(); } }, 'Siguiente →')
          : el('button', { class: 'btn btn-sm', type: 'button', onclick: limpiar }, 'Terminar')));
  };
  const empezarRecorrido = (r) => {
    seleccion = null; recorridoActual = r; pasoActual = 0;
    actualizarBotonesRecorrido();
    mostrarPaso();
  };
  if (D.recorridos?.length) {
    $('#recorridos').append(el('span', { class: 'rot' }, 'Recorridos:'));
    for (const r of D.recorridos) {
      const b = el('button', { class: 'btn btn-sm', type: 'button', 'aria-pressed': 'false', onclick: () => (recorridoActual?.id === r.id ? limpiar() : empezarRecorrido(r)) }, r.nombre);
      botonesRec.set(r.id, b);
      $('#recorridos').append(b);
    }
  } else {
    $('#recorridos').remove();
  }

  // ---- Busqueda
  $('#buscar').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    let hay = 0;
    for (const c of D.componentes) {
      const texto = [c.nombre, c.corto, c.que, c.version, ...(c.puertos || []).map((p) => p.n + ' ' + p.que)].join(' ').toLowerCase();
      const ok = !q || texto.includes(q);
      if (ok) hay++;
      nodosSvg.get(c.id).classList.toggle('oculto-busqueda', !ok);
      chips.get(c.id).hidden = !ok;
    }
    const sr = $('#sin-resultados');
    sr.hidden = hay > 0;
    if (!hay) poner(sr, el('strong', {}, `Ningún componente coincide con «${e.target.value}»`), 'Probá con el nombre de una herramienta o un puerto. ',
      el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { $('#buscar').value = ''; $('#buscar').dispatchEvent(new Event('input')); } }, 'Limpiar búsqueda'));
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (seleccion || recorridoActual)) limpiar(); });

  // ---- Como se usa
  const uso = $('#v-uso');
  uso.append(el('h2', { class: 'sr' }, 'Cómo se usa'));
  if (D.usoIntro) uso.append(el('p', { class: 'uso-intro' }, rico(D.usoIntro)));
  uso.append(el('ol', { class: 'pasos' }, (D.uso || []).map((p) => el('li', {}, el('div', {},
    el('h2', {}, p.titulo),
    el('p', {}, rico(p.texto)),
    (p.comandos || []).map(bloqueCmd),
    el('div', { class: 'acciones' },
      p.nodos?.length ? el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { irA('mapa'); const ids = new Set(p.nodos); resaltar(ids, new Set(aristas.filter((a) => ids.has(a.cx.de) && ids.has(a.cx.a)).map((a) => a.i))); seleccion = null; recorridoActual = null; poner(panel, el('span', { class: 'capa-tag' }, 'Cómo se usa'), el('h2', {}, p.titulo), el('p', {}, rico(p.texto)), el('div', { class: 'paso-nav' }, el('button', { class: 'btn btn-sm', type: 'button', onclick: limpiar }, 'Ver todo el mapa'))); } }, 'Ver en el mapa') : null,
      p.guia ? enlaceGuia(p.guia) : null))))));

  // ---- Puertos
  const vp = $('#v-puertos');
  const filas = [];
  for (const c of D.componentes) for (const p of c.puertos || []) filas.push({ c, p });
  filas.sort((a, b) => a.p.n - b.p.n);
  vp.append(el('h2', { class: 'sr' }, 'Puertos y accesos'));
  if (D.puertosIntro) vp.append(el('p', { class: 'uso-intro' }, rico(D.puertosIntro)));
  vp.append(filas.length ? el('div', { class: 'tabla-wrap' }, el('table', { class: 'tabla' },
    el('thead', {}, el('tr', {}, el('th', { style: 'text-align:right' }, 'Puerto'), el('th', {}, 'Componente'), el('th', {}, 'Para qué'), el('th', {}, 'Dónde se abre'))),
    el('tbody', {}, filas.map(({ c, p }) => el('tr', {},
      el('td', { class: 'num' }, p.n),
      el('td', {}, el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { irA('mapa'); elegir(c.id); } }, c.nombre)),
      el('td', {}, rico(p.que)),
      el('td', {}, p.url ? el('a', { href: p.url, target: '_blank', rel: 'noreferrer' }, p.url) : el('span', { style: 'color:var(--text-4)' }, 'interno')))))))
    : el('div', { class: 'vacio' }, el('strong', {}, 'Esta versión no publica puertos propios'), 'Usa los de la versión en la que se basa.'));

  panelInicio();
  const h = location.hash.slice(1);
  if (tabs.includes(h)) irA(h);
})();
</script>
</body>
</html>
